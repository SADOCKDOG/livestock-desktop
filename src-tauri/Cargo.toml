[package]
name = "livestock-manager-premium"
version = "4.11.15"
description = "Livestock Manager PREMIUM - app de escritorio nativa (Tauri)"
authors = ["SADOCKDOG"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Services_Store",
  "Foundation",
  "Foundation_Collections",
  "implement",
  "Win32_Foundation",
  "Win32_UI_Shell",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
