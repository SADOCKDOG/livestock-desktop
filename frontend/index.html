    <script>
      // Sandbox Guard Ultra-Robustecido para entornos iframe restringidos (Open Design Desktop)
      // Evita de forma síncrona caídas críticas al consultar serviceWorker e indexedDB
      try {
        var _testSW = navigator.serviceWorker;
      } catch (e) {
        console.warn("[Sandbox Guard] navigator.serviceWorker bloqueado en sandbox. Redefiniendo de forma segura...");
        try {
          Object.defineProperty(navigator, 'serviceWorker', {
            get: function() { return undefined; },
            configurable: true
          });
        } catch (err) {
          try {
            Object.defineProperty(Navigator.prototype, 'serviceWorker', {
              get: function() { return undefined; },
              configurable: true,
              enumerable: true
            });
          } catch (err2) {
            console.error("[Sandbox Guard] No se pudo redefinir serviceWorker en el prototipo:", err2);
          }
        }
      }

      try {
        var _testIDB = window.indexedDB;
      } catch (e) {
        console.warn("[Sandbox Guard] window.indexedDB bloqueado en sandbox. Redefiniendo para evitar caídas síncronas...");
        try {
          Object.defineProperty(window, 'indexedDB', {
            get: function() { return undefined; },
            configurable: true
          });
        } catch (err) {
          console.error("[Sandbox Guard] No se pudo redefinir indexedDB de forma segura:", err);
        }
      }
    </script>

    <div id="error-diag"></div>

    <script>
      // Global error diagnostic for Android
      window.onerror = function(msg, url, line, col, err) {
        const diag = document.getElementById('error-diag');
        if (diag) {
          diag.style.display = 'block';
          diag.innerHTML = 'Se ha producido un error: ' + msg + '<br>en ' + url + ':' + line + ':' + col + '\n\n<small style="opacity:0.5">Detalles técnicos disponibles en consola</small>';
          diag.onclick = () => diag.style.display = 'none';
        }
        console.error('[Error]', msg, '\nArchivo:', url, '\nLínea:', line, '\nCol:', col, '\nStack:', err?.stack);
        return true;
      };
      window.addEventListener('unhandledrejection', function(e) {
        const diag = document.getElementById('error-diag');
        if (diag) {
          diag.style.display = 'block';
          diag.innerHTML = 'Se ha producido un error. Pulsa para continuar.\n\n<small style="opacity:0.5">Detalles técnicos disponibles en consola</small>';
          diag.onclick = () => diag.style.display = 'none';
        }
        console.error('[Promise]', e.reason?.message || e.reason, '\nStack:', e.reason?.stack);
      });
      // El chrome (header y nav inferior) lleva onclick="App.*" inline y es pulsable
      // desde el primer pintado, pero App no existe hasta que terminan de cargar los
      // ~89 scripts. Tocar cualquier control en ese hueco lanza "App is not defined",
      // y el window.onerror de arriba lo presenta como un error grave.
      document.documentElement.classList.add("app-cargando");
      const _esperaApp = setInterval(() => {
        if (window.App) {
          document.documentElement.classList.remove("app-cargando");
          clearInterval(_esperaApp);
        }
      }, 120);

      // Rescue timer. Se comprueba `window.App` en vez del texto del contenedor: el
      // texto solo dice que aún no se ha pintado la vista, no que el arranque haya
      // fallado. Y 20s en vez de 8, que se agotaban en arranques en frío.
      setTimeout(() => {
        if (!window.App) {
          document.getElementById("startup-rescue").style.display = "block";
        }
      }, 20000);
    </script>

    <script>
    // ============================================
    // Sombra de scroll universal (reutilizable)
    // ============================================
    // Uso: window.enableScrollShadows(containerElement)
    window.enableScrollShadows = function(el) {
      if (!el) return;
      function updateShadows() {
        var max = el.scrollWidth - el.clientWidth;
        var atStart = el.scrollLeft <= 4;
        var atEnd = el.scrollLeft >= max - 4;
        if (atStart) el.removeAttribute('data-ss-start');
        else el.setAttribute('data-ss-start', '');
        if (atEnd) el.removeAttribute('data-ss-end');
        else el.setAttribute('data-ss-end', '');
      }
      el.addEventListener('scroll', updateShadows);
      window.addEventListener('resize', updateShadows);
      updateShadows();
    };
    </script>

    <script>
      window.isNative = !!window.Capacitor;
      // DESKTOP: la app no usa Service Worker (los assets van empaquetados en el
      // binario nativo). El SW heredado de la PWA (sw.js, estrategia cache-first)
      // servía CSS/JS obsoleto incluso tras Ctrl+F5 en la previsualización de
      // desarrollo. Si queda un SW registrado de visitas anteriores, se
      // desregistra y se purgan sus cachés, recargando una vez para servir fresco.
      try {
        if (navigator.serviceWorker && typeof navigator.serviceWorker.getRegistrations === 'function') {
          window.addEventListener("load", () => {
            navigator.serviceWorker.getRegistrations()
              .then((regs) => {
                if (!regs.length) return;
                return Promise.all(regs.map((r) => r.unregister()))
                  .then(() => (window.caches && caches.keys) ? caches.keys() : [])
                  .then((keys) => Promise.all((keys || []).map((k) => caches.delete(k))))
                  .then(() => {
                    if (!sessionStorage.getItem('sw-purged')) {
                      sessionStorage.setItem('sw-purged', '1');
                      location.reload();
                    }
                  });
              })
              .catch((err) => console.warn("SW purge:", err));
          });
        }
      } catch (e) {
        console.warn("Service Worker no disponible o bloqueado por el sandbox del entorno:", e.message);
      }
    </script>
