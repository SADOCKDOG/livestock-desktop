[package]
name = "livestock-manager-premium"
version = "0.1.0"
description = "Livestock Manager PREMIUM - app de escritorio nativa (Tauri)"
authors = ["SADOCKDOG"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
